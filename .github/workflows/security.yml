name: Security

# On every change, and weekly: new advisories are published against
# dependencies that have not changed, so a green PR can go red on its own.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      # Audit exactly what uv.lock pins (runtime and dev), hash-checked.
      - name: Export the locked dependency set
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt > requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit==2.10.1 --disable-pip --require-hashes --strict -r requirements-audit.txt

  workflow-audit:
    name: GitHub Actions security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: zizmor
        env:
          # Enables the online audits (known-vulnerable actions, impostor commits).
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.32.0 --format=github .github/

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}
