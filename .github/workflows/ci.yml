name: CI

# Every pull request, and every push to main.
on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a newer one is queued for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repository.
permissions:
  contents: read

env:
  # The Python version comes from .python-version, which uv reads.
  # Never let the lockfile drift silently: every `uv run` fails if uv.lock is stale.
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .
      - name: Format (black --check)
        run: uv run black --check --diff .
      # Workflow syntax, expression types, and shellcheck on every run: block.
      - name: Lint workflows (actionlint)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - name: mypy (django-stubs + pydantic plugins)
        run: uv run mypy .

  test:
    name: Test (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      # Coverage gate (fail_under = 100) lives in pyproject.toml.
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  django:
    name: Django checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      # -W error: a deprecation raised while loading settings/apps fails the job.
      - name: System checks
        run: uv run python -W error manage.py check --fail-level WARNING
      - name: No missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

  # Single required status for branch protection: green only if every job above
  # passed.
  all-green:
    name: CI passed
    if: ${{ always() }}
    needs: [lint, typecheck, test, django]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
