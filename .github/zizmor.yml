# zizmor configuration (https://docs.zizmor.sh/configuration/).
rules:
  unpinned-uses:
    config:
      policies:
        # GitHub's own actions are pinned to exact version tags for readability.
        "actions/*": ref-pin
        "github/*": ref-pin
        # Third-party actions must be pinned to a commit SHA (with the version in
        # a trailing comment): a tag can be moved to different code, which is how
        # the 2025 tj-actions/changed-files compromise spread. CodeQL's
        # actions/unpinned-tag query enforces the same split.
        "*": hash-pin
